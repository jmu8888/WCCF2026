<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0">

<title>第24届华盛顿中国文化节</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

.slider {
    width: 100%;
    height: 100%;
    display: flex;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
}

.slide {
    position: relative;
    min-width: 100%;
    height: 100%;
    scroll-snap-align: start;

    display: flex;
    justify-content: center;
    align-items: center;
}

.slide img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

.slide iframe {
    display: block;
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
    background: #000;
}

/* 隐藏滚动条 */
.slider::-webkit-scrollbar {
    display: none;
}

.slider {
    scrollbar-width: none;
}

/* 底部导航按钮 */
.toolbar {
    position: fixed;
    bottom: 8px;
    left: 0;
    right: 0;

    display: flex;
    justify-content: center;
    flex-wrap: nowrap;
    gap: 4px;
    padding: 0 4px;

    z-index: 10;
}

.toolbar a {
    padding: 3px 6px;
    border-radius: 10px;
    background: linear-gradient(180deg, #b5262a, #8f1c1f);
    color: #f4dfa3;
    font-size: 9px;
    font-weight: 600;
    text-decoration: none;
    white-space: nowrap;
    border: 1px solid #d4af5a;
    box-shadow: 0 2px 6px rgba(0,0,0,0.35);
    flex-shrink: 0;
}

.toolbar a:active {
    background: linear-gradient(180deg, #8f1c1f, #6f1416);
}

/* 页码圆点 */
.dots {
    position: fixed;
    bottom: 40px;
    left: 0;
    right: 0;

    display: flex;
    justify-content: center;
    gap: 8px;

    z-index: 10;
}

.dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: rgba(255,255,255,0.45);
}

.dot.active {
    background: white;
}
</style>
</head>

<body>

<div class="toolbar" id="toolbar">
    <a href="index.html#Slide4">平面图</a>
    <a href="index.html#Slide2">节目单</a>
    <a href="index.html#Slide6">组委会</a>
    <a href="index.html#Slide5">帐篷分配</a>
    <a href="2026 Washington Chinese Cultural Festival Schematic Layout of Tent and Camera Position2.pdf">帐篷名称</a>
    <a href="2026中国文化节交通指南.pdf">交通指南</a>
    <a href="index.html#Slide9">第二舞台</a>
</div>

<div class="slider" id="slider">

    <div class="slide">
        <img src="Page1.png" alt="封面">
    </div>

    <div class="slide" id="Slide2">
        <img src="Page2.jpg" alt="上午场">
    </div>

    <div class="slide" id="Slide3">
        <img src="Page3.jpg" alt="下午场">
    </div>
      
    <div class="slide" id="Slide4">
        <img src="FloorPlan.jpg" alt="场地图">
    </div>
      
    <div class="slide" id="Slide5">
        <iframe src="TentList.html" title="帐篷分配"></iframe>
    </div>
      
    <div class="slide" id="Slide6">
        <img src="组委会.jpg" alt="人员表">
    </div>
      
    <div class="slide" id="Slide9">
        <iframe src="stage2.html" title="第二舞台互动区节目单"></iframe>
    </div>

</div>

<div class="dots">
    <div class="dot active"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
</div>

<script>
const slider = document.getElementById("slider");
const dots = document.querySelectorAll(".dot");

slider.addEventListener("scroll", () => {

    const page =
        Math.round(slider.scrollLeft / slider.clientWidth);

    dots.forEach((dot, index) => {
        dot.classList.toggle("active", index === page);
    });

});
</script>

</body>
</html>
