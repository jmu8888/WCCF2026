<style>
:root {
    --gold: #e0b25a;
    --gold-dim: rgba(224,178,90,0.55);
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #10120e;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
}

* { box-sizing: border-box; }

/* ---------- 顶部标题条 ---------- */
.header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 20;
    padding: 8px 12px 6px;
    background: linear-gradient(180deg, rgba(10,12,8,0.92), rgba(10,12,8,0));
    text-align: center;
    pointer-events: none;
}

.header h1 {
    margin: 0;
    color: var(--gold);
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-shadow: 0 1px 4px rgba(0,0,0,0.6);
}

.header .sub {
    margin-top: 2px;
    color: rgba(255,255,255,0.65);
    font-size: 10px;
}

/* ---------- 日期跳转条 ---------- */
.daybar {
    position: fixed;
    top: 40px;
    left: 0;
    right: 0;
    z-index: 20;
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding: 4px 10px 6px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
}
.daybar::-webkit-scrollbar { display: none; }

.daybar button {
    flex: 0 0 auto;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 1px solid var(--gold-dim);
    background: rgba(0,0,0,0.35);
    color: rgba(255,255,255,0.75);
    font-size: 11px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
}

.daybar button.active {
    background: var(--gold);
    color: #241a04;
    border-color: var(--gold);
    box-shadow: 0 0 8px rgba(224,178,90,0.6);
}

/* ---------- 滑动容器 ---------- */
.slider {
    width: 100%;
    height: 100%;
    display: flex;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
}
.slider::-webkit-scrollbar { display: none; }
.slider { scrollbar-width: none; }

.slide {
    position: relative;
    min-width: 100%;
    height: 100%;
    scroll-snap-align: start;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 84px 18px 74px;
    color: #f3ead9;
}

/* ---------- 首页：路线图 ---------- */
.slide.home-slide {
    padding: 0;
    justify-content: center;
    align-items: center;
    background: #0b0d09;
}

.slide.home-slide img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

.home-hint {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 34px;
    z-index: 2;
    text-align: center;
    font-size: 11px;
    color: rgba(255,255,255,0.8);
    text-shadow: 0 1px 4px rgba(0,0,0,0.85);
    pointer-events: none;
}

/* 每天不同的主题渐变 */
.slide.region-flight    { background: linear-gradient(160deg, #1a2140, #0f1428 60%, #10120e); }
.slide.region-nairobi   { background: linear-gradient(160deg, #2b3a4a, #16202b 60%, #10120e); }
.slide.region-samburu   { background: linear-gradient(160deg, #7a4a24, #4a2c12 60%, #10120e); }
.slide.region-nakuru    { background: linear-gradient(160deg, #1f4a4d, #163333 60%, #10120e); }
.slide.region-village   { background: linear-gradient(160deg, #6b3220, #3d1c12 60%, #10120e); }
.slide.region-mara      { background: linear-gradient(160deg, #6b4a1e, #472f11 60%, #10120e); }
.slide.region-serengeti { background: linear-gradient(160deg, #7a3620, #4a1f10 60%, #10120e); }
.slide.region-arusha    { background: linear-gradient(160deg, #3a4a3a, #202b20 60%, #10120e); }
.slide.region-amboseli  { background: linear-gradient(160deg, #8a4a1e, #522d10 60%, #10120e); }
.slide.region-depart    { background: linear-gradient(160deg, #34404a, #1c242b 60%, #10120e); }
.slide.region-notes     { background: linear-gradient(160deg, #3a3428, #211d15 60%, #10120e); }

/* ---------- 行程须知 / 费用说明 ---------- */
.notes-section {
    margin-bottom: 14px;
}

.notes-section h3 {
    margin: 0 0 6px;
    font-size: 13px;
    color: var(--gold);
    font-weight: 700;
}

.notes-list {
    margin: 0;
    padding-left: 18px;
    font-size: 11.5px;
    line-height: 1.65;
    color: rgba(255,255,255,0.88);
}

.notes-list li {
    margin-bottom: 5px;
}

.notes-list.plain {
    list-style: none;
    padding-left: 0;
}

.notes-list.plain li {
    padding-left: 14px;
    position: relative;
}

.notes-list.plain li::before {
    content: "※";
    position: absolute;
    left: 0;
    color: var(--gold-dim);
}

.notes-group-label {
    font-size: 12px;
    font-weight: 700;
    color: rgba(255,255,255,0.85);
    margin: 10px 0 4px;
}

.notes-group-label:first-child {
    margin-top: 0;
}

.notes-list.contact {
    list-style: none;
    padding-left: 0;
}

.notes-list.contact a {
    color: var(--gold);
    text-decoration: none;
    font-weight: 600;
}

.slide-inner {
    overflow-y: auto;
    max-height: 100%;
    padding-right: 2px;
}

.day-tag {
    display: inline-flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 6px;
}

.day-tag .num {
    font-size: 34px;
    font-weight: 800;
    color: var(--gold);
    line-height: 1;
}

.day-tag .date {
    font-size: 13px;
    color: rgba(255,255,255,0.8);
    font-weight: 600;
}

.title {
    font-size: 19px;
    font-weight: 700;
    margin: 4px 0 10px;
    color: #fff;
}

.badges {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 10px;
}

.badge {
    font-size: 10.5px;
    padding: 3px 8px;
    border-radius: 10px;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.2);
    color: #fff;
    white-space: nowrap;
}

.badge.star {
    background: rgba(224,178,90,0.2);
    border-color: var(--gold-dim);
    color: var(--gold);
}

.desc {
    font-size: 13px;
    line-height: 1.7;
    color: rgba(255,255,255,0.9);
    margin-bottom: 12px;
}

/* ---------- 时间轴（逐条行程） ---------- */
.timeline {
    margin: 0 0 12px;
    padding: 0;
    list-style: none;
    border-left: 2px solid rgba(224,178,90,0.3);
}

.timeline li {
    position: relative;
    padding: 0 0 10px 14px;
    font-size: 12.5px;
    line-height: 1.6;
    color: rgba(255,255,255,0.92);
}

.timeline li::before {
    content: "";
    position: absolute;
    left: -5px;
    top: 5px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--gold);
}

.timeline .t {
    display: block;
    color: var(--gold);
    font-weight: 700;
    font-size: 12px;
    margin-bottom: 1px;
}

.info-card {
    background: rgba(0,0,0,0.32);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 12px;
    line-height: 1.8;
}

.info-row {
    display: flex;
    gap: 8px;
}

.info-row .label {
    flex: 0 0 44px;
    color: var(--gold);
    font-weight: 600;
}

.info-row .value {
    color: rgba(255,255,255,0.88);
}

.info-row.note .value {
    color: rgba(255,255,255,0.6);
    font-style: italic;
    font-size: 11px;
}

/* ---------- 航班卡片（Day0 / 返程） ---------- */
.flight-leg {
    background: rgba(0,0,0,0.32);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 10px;
}

.flight-leg .flight-date {
    font-size: 11px;
    color: var(--gold);
    font-weight: 600;
    margin-bottom: 8px;
}

.flight-route {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
}

.flight-route .ap {
    flex: 1;
    min-width: 0;
}

.flight-route .ap.arr { text-align: right; }

.flight-route .code {
    font-size: 20px;
    font-weight: 800;
    color: #fff;
}

.flight-route .city {
    font-size: 11px;
    color: rgba(255,255,255,0.7);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.flight-route .time {
    font-size: 13px;
    color: var(--gold);
    font-weight: 700;
    margin-top: 2px;
}

.flight-route .plane {
    flex: 0 0 auto;
    color: rgba(255,255,255,0.4);
    font-size: 15px;
    padding: 0 4px;
}

.flight-route .arrnote {
    font-size: 9.5px;
    color: rgba(255,255,255,0.55);
    margin-top: 2px;
}

.flight-meta {
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px dashed rgba(255,255,255,0.15);
    font-size: 11px;
    color: rgba(255,255,255,0.75);
    display: flex;
    flex-wrap: wrap;
    gap: 4px 10px;
}

.flight-meta b { color: #fff; }

/* ---------- 左右箭头（桌面点击用） ---------- */
.arrow {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    z-index: 15;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: rgba(0,0,0,0.35);
    border: 1px solid rgba(255,255,255,0.25);
    color: #fff;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
}
.arrow.left { left: 6px; }
.arrow.right { right: 6px; }
.arrow:active { background: rgba(0,0,0,0.55); }

/* ---------- 页码圆点 ---------- */
.dots {
    position: fixed;
    bottom: 12px;
    left: 0;
    right: 0;
    z-index: 20;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 5px;
    padding: 0 20px;
}

.dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: rgba(255,255,255,0.35);
}

.dot.active {
    background: var(--gold);
    box-shadow: 0 0 4px var(--gold);
}
</style>
</head>

const weekdayNames = ["周日","周一","周二","周三","周四","周五","周六"];

function fmtDate(base, offset) {
    const d = new Date(base + "T00:00:00");
    d.setDate(d.getDate() + offset);
    const mm = String(d.getMonth()+1).padStart(2,"0");
    const dd = String(d.getDate()).padStart(2,"0");
    return { label: mm + "-" + dd, weekday: weekdayNames[d.getDay()] };
}

function renderFlightLeg(leg) {
    const arrNote = leg.arr.note ? '<div class="arrnote">' + leg.arr.note + '</div>' : '';
    return (
        '<div class="flight-leg">' +
            '<div class="flight-date">' + leg.date + '</div>' +
            '<div class="flight-route">' +
                '<div class="ap dep">' +
                    '<div class="code">' + leg.dep.code + '</div>' +
                    '<div class="city">' + leg.dep.city + '</div>' +
                    '<div class="time">' + leg.dep.time + '</div>' +
                '</div>' +
                '<div class="plane">&#9992;</div>' +
                '<div class="ap arr">' +
                    '<div class="code">' + leg.arr.code + '</div>' +
                    '<div class="city">' + leg.arr.city + '</div>' +
                    '<div class="time">' + leg.arr.time + '</div>' +
                    arrNote +
                '</div>' +
            '</div>' +
            '<div class="flight-meta">' +
                '<span><b>' + leg.flightNo + '</b></span>' +
                '<span>' + leg.operator + '</span>' +
                '<span>Class: (' + leg.cls + ')</span>' +
                '<span>' + leg.meals + '</span>' +
            '</div>' +
        '</div>'
    );
}

            : '';
        const transportRow = day.transport
            ? '<div class="info-row"><div class="label">交通</div><div class="value">' + day.transport + '</div></div>'
            : '';
        const activityRow = day.activity
            ? '<div class="info-row"><div class="label">活动</div><div class="value">' + day.activity + '</div></div>'
            : '';
        const noteRow = day.note
            ? '<div class="info-row note"><div class="label">备注</div><div class="value">' + day.note + '</div></div>'
            : '';
        bodyHtml =
            timelineHtml +
            '<div class="info-card">' +
                hotelRow +
                transportRow +
                '<div class="info-row"><div class="label">用餐</div><div class="value">' + day.mealsRaw + '</div></div>' +
                activityRow +
                noteRow +
            '</div>';
    }

    slide.innerHTML =
        '<div class="slide-inner">' +
            '<div class="day-tag"><span class="num">D' + day.dayNum + '</span><span class="date">' + d.label + ' ' + d.weekday + '</span></div>' +
            '<div class="title">' + day.title + '</div>' +
            (badgesHtml ? '<div class="badges">' + badgesHtml + '</div>' : '') +
            bodyHtml +
        '</div>';

    slider.appendChild(slide);

    // dot
    const dot = document.createElement("div");
    dot.className = "dot";
    dotsEl.appendChild(dot);

    // daybar button
    const btn = document.createElement("button");
    btn.textContent = String(day.dayNum);
    btn.className = "";
    btn.addEventListener("click", () => {
        slide.scrollIntoView({ behavior: "smooth", inline: "start" });
    });
    daybarEl.appendChild(btn);
});

const dots = document.querySelectorAll(".dot");
const dayBtns = document.querySelectorAll(".daybar button");

function updateActive() {
    const page = Math.round(slider.scrollLeft / slider.clientWidth);
    dots.forEach((dot, index) => dot.classList.toggle("active", index === page));
    dayBtns.forEach((btn, index) => btn.classList.toggle("active", index === page));
    const activeBtn = dayBtns[page];
    if (activeBtn) activeBtn.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
}

slider.addEventListener("scroll", updateActive);

document.getElementById("arrowLeft").addEventListener("click", () => {
    slider.scrollBy({ left: -slider.clientWidth, behavior: "smooth" });
});
document.getElementById("arrowRight").addEventListener("click", () => {
    slider.scrollBy({ left: slider.clientWidth, behavior: "smooth" });
});

document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight") slider.scrollBy({ left: slider.clientWidth, behavior: "smooth" });
    if (e.key === "ArrowLeft") slider.scrollBy({ left: -slider.clientWidth, behavior: "smooth" });
});
</script>

</body>
</html>
