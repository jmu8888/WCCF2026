<!-- D11-12 安博塞利 -->
<circle cx="855" cy="711" r="8" fill="#fff" stroke="#2b2b2b" stroke-width="2.5"/>
<text x="873" y="702" font-size="14" font-weight="700" fill="#1c1c1c">Oilepo Amboseli</text>
<text x="873" y="720" font-size="13" font-weight="700" fill="#c0392b">D11-12 · 安博塞利</text>

<!-- 图例 / 标题 -->
<rect x="18" y="18" width="330" height="58" rx="10" fill="rgba(255,255,255,0.85)" stroke="#d8d2c2"/>
<text x="34" y="42" font-size="17" font-weight="800" fill="#1c1c1c">肯尼亚 + 坦桑尼亚 游猎路线图</text>
<text x="34" y="62" font-size="12" fill="#555">Aug 17 – Aug 28, 2026 · KT260817-28</text>

<!-- 指北针 -->
<g transform="translate(1020,50)">
    <circle r="26" fill="rgba(255,255,255,0.85)" stroke="#d8d2c2"/>
    <path d="M0,-18 L7,6 L0,0 L-7,6 Z" fill="#2b2b2b"/>
    <text x="0" y="-24" font-size="12" font-weight="700" text-anchor="middle" fill="#2b2b2b">N</text>
</g>

</svg>
