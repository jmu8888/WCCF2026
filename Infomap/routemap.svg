<!-- D6 马赛马拉 -->
<circle cx="468" cy="470" r="8" fill="#fff" stroke="#2b2b2b" stroke-width="2.5"/>
<text x="450" y="452" font-size="14" font-weight="700" fill="#1c1c1c" text-anchor="end">Mara Elatia</text>
<text x="450" y="470" font-size="13" font-weight="700" fill="#c0392b" text-anchor="end">D6 · 马赛马拉</text>

